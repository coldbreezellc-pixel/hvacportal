    // ── GitHub API storage backend ──
    const GH_OWNER = "coldbreezellc-pixel";
    const GH_REPO = "hvacportal";
    const GH_BRANCH = "main";
    const GH_TOKEN = "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";
    const GH_API = "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/data/";

    const _shaCache = {};

    window.storage = {
      async get(key) {
        const url = GH_API + key + ".json?ref=" + GH_BRANCH + "&t=" + Date.now();
        const res = await fetch(url, { headers: { Authorization: "Bearer " + GH_TOKEN, Accept: "application/vnd.github.v3+json" } });
        if (!res.ok) throw new Error("Not found");
        const data = await res.json();
        _shaCache[key] = data.sha;
        const content = atob(data.content.replace(/\n/g, ""));
        return { key, value: content };
      },
      async set(key, value) {
        const url = GH_API + key + ".json";
        const body = { message: "Update " + key, content: btoa(unescape(encodeURIComponent(value))), branch: GH_BRANCH };
        if (!_shaCache[key]) {
          try {
            const check = await fetch(url + "?ref=" + GH_BRANCH, { headers: { Authorization: "Bearer " + GH_TOKEN, Accept: "application/vnd.github.v3+json" } });
            if (check.ok) { const d = await check.json(); _shaCache[key] = d.sha; }
          } catch {}
        }
        if (_shaCache[key]) body.sha = _shaCache[key];
        const res = await fetch(url, { method: "PUT", headers: { Authorization: "Bearer " + GH_TOKEN, Accept: "application/vnd.github.v3+json", "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (!res.ok) { const err = await res.text(); console.error("GitHub save error:", err); throw new Error("Save failed"); }
        const result = await res.json();
        _shaCache[key] = result.content.sha;
        return { key, value };
      },
      async delete(key) {
        const url = GH_API + key + ".json";
        if (!_shaCache[key]) {
          try { const check = await fetch(url + "?ref=" + GH_BRANCH, { headers: { Authorization: "Bearer " + GH_TOKEN } }); if (check.ok) { const d = await check.json(); _shaCache[key] = d.sha; } } catch {}
        }
        if (_shaCache[key]) {
          await fetch(url, { method: "DELETE", headers: { Authorization: "Bearer " + GH_TOKEN, Accept: "application/vnd.github.v3+json", "Content-Type": "application/json" }, body: JSON.stringify({ message: "Delete " + key, sha: _shaCache[key], branch: GH_BRANCH }) });
          delete _shaCache[key];
        }
        return { key, deleted: true };
      },
      async list(prefix) {
        return { keys: [], prefix };
      }
    };

    const _localCache = {
      get(key) { try { return localStorage.getItem("gh_" + key); } catch { return null; } },
      set(key, val) { try { localStorage.setItem("gh_" + key, val); } catch {} }
    };

    const _origGet = window.storage.get.bind(window.storage);
    const _origSet = window.storage.set.bind(window.storage);
    window.storage.get = async function(key) {
      try {
        const remote = await _origGet(key);
        _localCache.set(key, remote.value);
        return remote;
      } catch {
        const cached = _localCache.get(key);
        if (cached) return { key, value: cached };
        throw new Error("Not found");
      }
    };
    window.storage.set = async function(key, value) {
      _localCache.set(key, value);
      return _origSet(key, value);
    };

const hash = async (pw) => {
  const enc = new TextEncoder().encode(pw + "penguin-maint-2026");
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
};

// ── Bing Image Thumbnails for part photos (free, no API key needed) ──
let _imgFetching = false;

const fetchPartImage = async (partNumber, itemName) => {
  if (!partNumber) return null;
  try {
    const q = encodeURIComponent(partNumber.trim() + " " + (itemName || "").trim());
    const url = "https://tse1.mm.bing.net/th?q=" + q + "&w=120&h=120&c=7&rs=1&p=0";
    // Verify image loads
    const res = await fetch(url);
    if (res.ok) {
      const blob = await res.blob();
      if (blob.size > 1000) return url; // real image (not blank)
    }
  } catch (e) { console.error("Image fetch error:", e); }
  return null;
};

const processImageQueue = async (items, onUpdate) => {
  if (_imgFetching) return;
  _imgFetching = true;
  for (const item of items) {
    if (item.photo || item.photoFailed || !item.partNumber) continue;
    await new Promise(r => setTimeout(r, 300));
    const imgUrl = await fetchPartImage(item.partNumber, item.name);
    if (imgUrl) {
      await onUpdate(item.id, { photo: imgUrl });
    } else {
      await onUpdate(item.id, { photoFailed: true });
    }
  }
  _imgFetching = false;
};

    // [unitId, qtyUnits, filterSize, qtyPerUnit, total, inStock]
    return {
      id: group.slice(0,2).toLowerCase() + "-" + i,
      name: r[2], // filter size as name
      partNumber: "",
      qty: r[5], // in stock
      notes: "",
      unitId: r[0], qtyUnits: r[1], qtyPerUnit: r[3], totalNeeded: r[4],
      group, category: "", minQty: 0, location: "",
      createdBy: "Import", createdAt: new Date().toISOString(), lastUpdated: new Date().toISOString(),
    };
  }
  return {
    id: group.slice(0,2).toLowerCase() + "-" + i,
    name: r[0], partNumber: r[1], qty: r[2], notes: r[3],
    group, category: "", minQty: 0, location: "",

  };

function App() {
  const [ready, setReady] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [view, setView] = useState("login"); // login | forgot | dashboard | inventory | users | profile
  const [users, setUsers] = useState([]);
  const [items, setItems] = useState([]);
  const [toast, setToast] = useState(null);
  const [logs, setLogs] = useState([]);
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("name");
  const [activeGroup, setActiveGroup] = useState("Plumbing");
  const pollRef = useRef(null);

  // ── Toast ──
  const flash = useCallback((msg, type = "ok") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3000);
  }, []);

  // ── Storage helpers ──
  const loadUsers = useCallback(async () => {
    try {
      const r = await window.storage.get("pm_users");
      if (r?.value) return JSON.parse(r.value);
    } catch {}
    return null;
  }, []);

  const saveUsers = useCallback(async (u) => {
    await window.storage.set("pm_users", JSON.stringify(u));
  }, []);

  const loadItems = useCallback(async () => {
    try {
      const r = await window.storage.get("pm_inventory");
      if (r?.value) return JSON.parse(r.value);
    } catch {}
    return [];
  }, []);

  const saveItems = useCallback(async (list) => {
    await window.storage.set("pm_inventory", JSON.stringify(list));
  }, []);

  const loadLogs = useCallback(async () => {
    try {
      const r = await window.storage.get("pm_logs");
      if (r?.value) return JSON.parse(r.value);
    } catch {}
    return [];
  }, []);

  const saveLogs = useCallback(async (list) => {
    await window.storage.set("pm_logs", JSON.stringify(list));
  }, []);

  const addLog = useCallback(async (action, detail, userName) => {
    const entry = { id: uid(), action, detail, user: userName || "System", ts: new Date().toISOString() };
    setLogs(prev => {
      const updated = [entry, ...prev].slice(0, 500); // keep last 500
      saveLogs(updated);
      return updated;
    });
  }, [saveLogs]);

  // ── Init ──
  useEffect(() => {
    (async () => {
      let existingUsers = await loadUsers();
      if (!existingUsers || existingUsers.length === 0) {
        existingUsers = [...TEAM_SEED];
        await saveUsers(existingUsers);
      } else {
        // Ensure all team accounts exist on this device
        const existingUsernames = new Set(existingUsers.map(u => u.username));
        let added = false;
        for (const seed of TEAM_SEED) {
          if (!existingUsernames.has(seed.username)) {
            existingUsers.push(seed);
            added = true;
          }
        }
        if (added) await saveUsers(existingUsers);
      }
      setUsers(existingUsers);
      let inv = await loadItems();
      if (!inv || inv.length === 0) {
        inv = [];
        for (const [group, arr] of Object.entries(SEED_DATA)) {
          inv.push(...buildSeedItems(group, arr));
        }
        await saveItems(inv);
      } else {
        // Remove old "Air Filters" group if split into 900/904
        inv = inv.filter(i => i.group !== "Air Filters");
        // Force re-seed filters if they don't have the spreadsheet format (unitId + qtyPerUnit)
        const hasSpreadsheetFormat = inv.some(i => i.group === "Air Filters 900" && i.unitId && i.qtyPerUnit !== undefined);
        if (!hasSpreadsheetFormat) {
          inv = inv.filter(i => !i.group?.startsWith("Air Filters"));
        }
        // Add any new seed groups not yet in storage
        const existingGroups = new Set(inv.map(i => i.group));
        let added = false;
        for (const [group, arr] of Object.entries(SEED_DATA)) {
          if (!existingGroups.has(group)) {
            inv.push(...buildSeedItems(group, arr));
            added = true;
          }
        }
        if (added) await saveItems(inv);
      }
      setItems(inv);
      const lg = await loadLogs();
      setLogs(lg || []);
      // check session
      try {
        const sessVal = localStorage.getItem("pm_session"); const sess = sessVal ? { value: sessVal } : null;
        if (sess?.value) {
          const s = JSON.parse(sess.value);
          const u = existingUsers.find(x => x.id === s.userId);
          if (u) {
            setCurrentUser(u);
            setView(u.mustResetPw ? "profile" : "dashboard");
          }
        }
      } catch {}
      setReady(true);
    })();
  }, []);

  // ── Polling for live updates ──
  useEffect(() => {
    if (!currentUser) return;
    pollRef.current = setInterval(async () => {
      const inv = await loadItems();
      if (inv) setItems(inv);
      const u = await loadUsers();
      if (u) setUsers(u);
      const lg = await loadLogs();
      if (lg) setLogs(lg);
    }, POLL_MS);
    return () => clearInterval(pollRef.current);
  }, [currentUser]);

  // ── Auth ──
  const login = async (username, password) => {
    const h = await hash(password.trim());
    const u = users.find(x => x.username.toLowerCase() === username.trim().toLowerCase() && x.passwordHash === h);
    if (!u) return flash("Invalid username or password.", "err");
    setCurrentUser(u);
    localStorage.setItem("pm_session", JSON.stringify({ userId: u.id }));
    setView(u.mustResetPw ? "profile" : "dashboard");
    addLog("Login", `${u.displayName} signed in`, u.displayName);
    flash(`Welcome back, ${u.displayName}`);
  };

    addLog("Logout", `${currentUser.displayName} signed out`, currentUser.displayName);

    setView("login");

    return nu;
  };

  const updateUser = async (id, data) => {
    const target = users.find(u => u.id === id);
    let updated = users.map(u => u.id === id ? { ...u, ...data } : u);
    setUsers(updated);
    await saveUsers(updated);
    addLog("User Updated", `Updated user "${target?.displayName || id}"`, currentUser?.displayName);
    flash("User updated.");
  };

  const deleteUser = async (id) => {
    const target = users.find(u => u.id === id);
    const updated = users.filter(u => u.id !== id);
    setUsers(updated);
    await saveUsers(updated);
    addLog("User Deleted", `Deleted user "${target?.displayName || id}"`, currentUser?.displayName);

  const resetPassword = async (id, newPw) => {

    setUsers(updated);
    await saveUsers(updated);
    addLog("Password Reset", `Reset password for "${users.find(u => u.id === id)?.displayName || id}"`, currentUser?.displayName);
    flash("Password reset. User must change on next login.");
  };

  const changeOwnPassword = async (newPw) => {
    const h = await hash(newPw.trim());
    const updated = users.map(u => u.id === currentUser.id ? { ...u, passwordHash: h, mustResetPw: false } : u);
    setUsers(updated);
    await saveUsers(updated);
    setCurrentUser({ ...currentUser, passwordHash: h, mustResetPw: false });
    addLog("Password Changed", `${currentUser.displayName} changed their password`, currentUser.displayName);
    flash("Password changed.");
    setView("dashboard");
  };

  // ── Inventory CRUD ──
  const addItem = async (item) => {
    const ni = { ...item, group: item.group || activeGroup, id: uid(), createdBy: currentUser.displayName, createdAt: new Date().toISOString(), lastUpdated: new Date().toISOString() };
    const updated = [...items, ni];
    setItems(updated);
    await saveItems(updated);
    addLog("Item Added", `Added "${item.name}" to ${ni.group} (qty: ${ni.qty})`, currentUser.displayName);
    flash(`"${item.name}" added.`);
  };

  const updateItem = async (id, data) => {
    const old = items.find(i => i.id === id);
    const updated = items.map(i => i.id === id ? { ...i, ...data, lastUpdated: new Date().toISOString(), updatedBy: currentUser.displayName } : i);
    setItems(updated);
    await saveItems(updated);
    const changes = [];
    if (data.name && data.name !== old?.name) changes.push(`name: "${old?.name}" → "${data.name}"`);
    if (data.notes !== undefined && data.notes !== old?.notes) changes.push("description updated");
    if (data.qty !== undefined && data.qty !== old?.qty) changes.push(`qty: ${old?.qty} → ${data.qty}`);
    addLog("Item Updated", `Updated "${old?.name || id}"${changes.length ? " — " + changes.join(", ") : ""}`, currentUser.displayName);
    flash("Item updated.");
  };

  const deleteItem = async (id) => {
    const target = items.find(i => i.id === id);
    const updated = items.filter(i => i.id !== id);
    setItems(updated);
    await saveItems(updated);
    addLog("Item Deleted", `Deleted "${target?.name || id}" from ${target?.group || "unknown"}`, currentUser.displayName);
    flash("Item removed.");
  };

  // Debounced save — batches rapid changes into one API call
  const saveTimerRef = useRef(null);
  const pendingItemsRef = useRef(null);
  const debouncedSaveItems = useCallback((list) => {
    pendingItemsRef.current = list;
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      if (pendingItemsRef.current) {
        await saveItems(pendingItemsRef.current);
        pendingItemsRef.current = null;
      }
    }, 1500);
  }, [saveItems]);

  const adjustQty = async (id, delta) => {
    const old = items.find(i => i.id === id);
    const updated = items.map(i => {
      if (i.id !== id) return i;
      const nq = Math.max(0, (i.qty || 0) + delta);
      return { ...i, qty: nq, lastUpdated: new Date().toISOString(), updatedBy: currentUser.displayName };
    });
    setItems(updated);
    debouncedSaveItems(updated);
    const nq = Math.max(0, (old?.qty || 0) + delta);
    addLog("Qty Changed", `"${old?.name}" qty: ${old?.qty} → ${nq}`, currentUser.displayName);
  };

  // ── Filtered / sorted items ──
  const filtered = items
    .filter(i => (i.group || "Misc") === activeGroup)
    .filter(i => !search || i.name.toLowerCase().includes(search.toLowerCase()) || (i.partNumber || "").toLowerCase().includes(search.toLowerCase()) || (i.unitId || "").toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => {
      if (sortBy === "name") return a.name.localeCompare(b.name);
      if (sortBy === "qty") return (a.qty || 0) - (b.qty || 0);
      return 0;
    });

  const lowStock = items.filter(i => (i.qty || 0) <= (i.minQty || 0) && (i.minQty || 0) > 0);

  if (!ready) return <div style={S.loadWrap}><div style={S.spinner} /><p style={{ color: "#64748b", marginTop: 16, fontFamily: F.body }}>Loading inventory…</p></div>;

  return (
    <div style={S.shell}>
      <style>{globalCSS}</style>
      {toast && <div style={{ ...S.toast, background: toast.type === "err" ? "#dc2626" : "#16a34a" }}>{toast.msg}</div>}

      {!currentUser ? (
        view === "forgot" ? <ForgotScreen onBack={() => setView("login")} users={users} flash={flash} /> : <LoginScreen onLogin={login} onForgot={() => setView("forgot")} />
      ) : (
        <>
          <Header user={currentUser} view={view} setView={setView} logout={logout} lowStock={lowStock.length} />
          {currentUser.mustResetPw && view !== "profile" ? (
            <div style={S.page}><div style={S.card}><p style={{ fontFamily: F.body, color: "#d97706", margin: 0 }}>⚠ You must change your password before continuing.</p><button style={S.btnPrimary} onClick={() => setView("profile")}>Change Password</button></div></div>
          ) : (
            <>
              {view === "dashboard" && <Dashboard items={items} lowStock={lowStock} setView={setView} setActiveGroup={setActiveGroup} />}
              {view === "inventory" && (
                <InventoryView
                  items={filtered} allItems={items} search={search} setSearch={setSearch}
                  activeGroup={activeGroup} setActiveGroup={setActiveGroup}
                  sortBy={sortBy} setSortBy={setSortBy}
                  onAdd={addItem} onUpdate={updateItem} onDelete={deleteItem} onAdjust={adjustQty}
                  onResetStock={async (ids) => {
                    const updated = items.map(i => ids.has(i.id) ? { ...i, qty: 0, lastUpdated: new Date().toISOString(), updatedBy: currentUser.displayName } : i);
                    setItems(updated);
                    await saveItems(updated);
                    addLog("Stock Reset", `Reset ${ids.size} items to 0 in ${activeGroup}`, currentUser.displayName);
                  }}
                  isAdmin={currentUser.role === "admin"}
                />
              )}
              {view === "users" && currentUser.role === "admin" && (
                <UsersView users={users} onCreate={createUser} onUpdate={updateUser} onDelete={deleteUser} onResetPw={resetPassword} currentUserId={currentUser.id} />
              )}
              {view === "logs" && currentUser.role === "admin" && <LogsView logs={logs} />}
              {view === "profile" && <ProfileView user={currentUser} onChangePw={changeOwnPassword} mustReset={currentUser.mustResetPw} />}
            </>
          )}
        </>
      )}
    </div>
  );
}

    const g = i.group || "Misc";
    if (!groups[g]) groups[g] = { count: 0, units: 0, zero: 0 };
    groups[g].count++;
    groups[g].units += (i.qty || 0);
    if ((i.qty || 0) === 0) groups[g].zero++;

  return (
    <div style={S.page}>

function InventoryView({ items, allItems, search, setSearch, activeGroup, setActiveGroup, sortBy, setSortBy, onAdd, onUpdate, onDelete, onAdjust, onResetStock, isAdmin }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [confirmDelItem, setConfirmDelItem] = useState(null);
  const [inlineEdit, setInlineEdit] = useState(null);
  const [selectedGroup, setSelectedGroup] = useState(null);
  const [editingQty, setEditingQty] = useState(null); // {id, value}
  const [engineers, setEngineers] = useState([]);
  const [engInput, setEngInput] = useState("");
  const engInputRef = useRef(null);

  const addEngineer = (name) => { const c = name.trim(); if (c && !engineers.includes(c)) setEngineers([...engineers, c]); };
  const removeEngineer = (idx) => setEngineers(engineers.filter((_, i) => i !== idx));
  const handleEngKey = (e) => {
    if (e.key === "Enter" || e.key === ",") { e.preventDefault(); addEngineer(engInput.replace(/,/g, "")); setEngInput(""); }
    if (e.key === "Backspace" && !engInput && engineers.length > 0) removeEngineer(engineers.length - 1);
  };
  const handleEngBlur = () => { if (engInput.trim()) { addEngineer(engInput); setEngInput(""); } };

  // Auto-fetch Google images for Plumbing & Faucet Parts items missing photos
  useEffect(() => {
    if ((selectedGroup === "Plumbing" || selectedGroup === "Faucet Parts") && items.length > 0) {
      const needPhotos = items.filter(i => !i.photo && !i.photoFailed && i.partNumber);
      if (needPhotos.length > 0) {
        processImageQueue(needPhotos, onUpdate);
      }
    }
  }, [selectedGroup, items.length]);

  // Export to Excel and open email
  const exportAndEmail = () => {
    if (engineers.length === 0) { alert("Please add at least one engineer name."); return; }
    const now = new Date();
    const dateStr = (now.getMonth()+1) + "/" + now.getDate() + "/" + now.getFullYear();

    // Group items by filter size
    const groups = {};
    const order = [];
    items.forEach(i => {
      if (!groups[i.name]) { groups[i.name] = []; order.push(i.name); }
      groups[i.name].push(i);
    });

    // Build CSV rows
    let csv = "FILTER INVENTORY REPORT\n";
    csv += "Building:," + (selectedGroup || "") + "\n";
    csv += "Date:," + dateStr + "\n";
    csv += "Engineer(s):," + engineers.join("; ") + "\n\n";
    csv += "Unit ID,Units,Filter Size,Per Unit,Total,In Stock,Order\n";

    order.forEach(filterSize => {
      const grp = groups[filterSize];
      grp.forEach(i => {
        const total = i.totalNeeded || 0;
        const stock = i.qty || 0;
        const ord = total > 0 ? Math.max(0, (total * 2) - stock) : 0;
        const uid = (i.unitId || "").replace(/,/g, ";");
        csv += '"' + uid + '",' + (i.qtyUnits || "") + "," + i.name + "," + (i.qtyPerUnit || "") + "," + total + "," + stock + "," + ord + "\n";
      });
      // Subtotal
      const sumT = grp.reduce((s, i) => s + (i.totalNeeded || 0), 0);
      const sumS = grp.reduce((s, i) => s + (i.qty || 0), 0);
      const sumO = grp.reduce((s, i) => { const t = i.totalNeeded || 0; return s + (t > 0 ? Math.max(0, (t * 2) - (i.qty || 0)) : 0); }, 0);
      csv += ",,,SUBTOTAL: " + filterSize + "," + sumT + "," + sumS + "," + sumO + "\n";
    });

    // Download CSV as .xls (Excel opens CSV fine)
    const bldg = (selectedGroup || "Filters").replace(/\s/g, "_");
    const filename = "Filter_Inventory_" + bldg + "_" + now.toISOString().slice(0,10) + ".xls";
    const blob = new Blob(["\uFEFF" + csv], { type: "application/vnd.ms-excel;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);

    // Open email
    const subject = encodeURIComponent(selectedGroup + " — Filter Inventory — " + engineers.join(", ") + " — " + dateStr);
    const body = encodeURIComponent(
      "Please find attached the filter inventory report.\n\n" +
      "Building: " + (selectedGroup || "") + "\n" +
      "Engineer(s): " + engineers.join(", ") + "\n" +
      "Date: " + dateStr + "\n\n" +
      "Note: Please attach the downloaded file (" + filename + ") to this email."
    );
    setTimeout(() => {
      window.location.href = "mailto:mateusz.targosz@versantmedia.com,sean.fanning@versantmedia.com?subject=" + subject + "&body=" + body;
    }, 800);
  };

  // Get groups that have items
  const groupsWithItems = INVENTORY_GROUPS.filter(g => allItems.some(i => (i.group || "Misc") === g));
  const extraGroups = [...new Set(allItems.map(i => i.group || "Misc"))].filter(g => !INVENTORY_GROUPS.includes(g));
  const allGroups = [...groupsWithItems, ...extraGroups];

  const openGroup = (g) => { setSelectedGroup(g); setActiveGroup(g); setSearch(""); setExpanded(null); };
  const goBack = () => { setSelectedGroup(null); setShowForm(false); setEditing(null); setExpanded(null); setSearch(""); };

  // ── GROUP LANDING PAGE ──
  if (!selectedGroup) {
    const groupIcons = { "Plumbing": "🔧", "Faucet Parts": "🚿", "Air Filters 900": "🏢", "Air Filters 904": "🏗", "Electrical": "⚡", "HVAC": "❄️", "Lighting": "💡", "Hardware": "🔩", "Safety": "🦺", "Tools": "🛠", "AV/Tech": "📡", "Misc": "📦" };
    return (
      <div style={S.page}>
        <h2 style={S.pageTitle}>Inventory</h2>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {allGroups.map(g => {
            const groupItems = allItems.filter(i => (i.group || "Misc") === g);
            const totalUnits = groupItems.reduce((s, i) => s + (i.qty || 0), 0);
            const outOfStock = groupItems.filter(i => (i.qty || 0) === 0).length;
            return (
              <button key={g} onClick={() => openGroup(g)} style={{
                background: "#ffffff", border: "1.5px solid #e2e8f0", borderRadius: 14, padding: "20px 16px",
                cursor: "pointer", textAlign: "left", transition: "all .2s", boxShadow: "0 1px 3px rgba(0,0,0,0.04)",
              }}>
                <div style={{ fontSize: 28, marginBottom: 8 }}>{groupIcons[g] || "📦"}</div>
                <div style={{ fontFamily: F.heading, fontSize: 15, color: "#0f172a", fontWeight: 700, marginBottom: 4 }}>{g}</div>
                <div style={{ fontFamily: F.body, fontSize: 12, color: "#64748b" }}>{groupItems.length} items · {totalUnits} units</div>
                {outOfStock > 0 && <div style={{ fontFamily: F.body, fontSize: 11, color: "#ef4444", marginTop: 3 }}>{outOfStock} out of stock</div>}
              </button>
            );
          })}
        </div>
        <div style={{ height: 80 }} />
      </div>
    );
  }

  // ── ITEM LIST FOR SELECTED GROUP ──
  const isFilterGroup = selectedGroup?.startsWith("Air Filters");

  return (
    <div style={S.page}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <button onClick={goBack} style={{ background: "none", border: "none", color: "#0d9488", fontSize: 24, cursor: "pointer", fontWeight: 700, padding: "4px 0", lineHeight: 1 }}>←</button>
        <h2 style={{ ...S.pageTitle, margin: 0, flex: 1 }}>{selectedGroup}</h2>
        <button style={{ ...S.btnPrimary, width: "auto", padding: "8px 16px" }} onClick={() => { setEditing(null); setShowForm(true); }}>+ Add</button>
      </div>

      <input style={S.input} value={search} onChange={e => setSearch(e.target.value)} placeholder="Search items, filter size, or unit…" />

      {/* ── ENGINEER NAME INPUT (filter groups only) ── */}
      {isFilterGroup && (
        <div style={{ marginTop: 8, marginBottom: 12 }}>
          <label style={{ ...S.label, marginBottom: 4 }}>Engineer(s) performing inventory</label>
          <div style={{ border: "1.5px solid #e2e8f0", borderRadius: 10, background: "#fff", padding: "6px 8px", display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", minHeight: 44, cursor: "text" }}
            onClick={() => engInputRef.current?.focus()}>
            {engineers.map((name, idx) => (
              <span key={idx} style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "#f0fdfa", border: "1px solid #99f6e4", borderRadius: 6, padding: "4px 8px", fontFamily: F.body, fontSize: 13, fontWeight: 600, color: "#0d9488" }}>
                {name}
                <button onClick={(e) => { e.stopPropagation(); removeEngineer(idx); }} style={{ width: 18, height: 18, borderRadius: "50%", border: "none", background: "rgba(13,148,136,0.15)", color: "#0d9488", fontSize: 11, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1 }}>✕</button>
              </span>
            ))}
            <input ref={engInputRef} value={engInput} onChange={e => setEngInput(e.target.value)} onKeyDown={handleEngKey} onBlur={handleEngBlur}
              placeholder={engineers.length ? "Add another…" : "Type name, press Enter…"}
              style={{ border: "none", outline: "none", background: "transparent", fontFamily: F.body, fontSize: 14, color: "#1e293b", flex: 1, minWidth: 120, padding: "4px 0" }}
              autoCapitalize="words" autoCorrect="off" spellCheck="false" />
          </div>
        </div>
      )}

      {!isFilterGroup && (
        <div style={{ display: "flex", gap: 8, marginBottom: 12, marginTop: 6 }}>
          <select style={S.select} value={sortBy} onChange={e => setSortBy(e.target.value)}>
            <option value="name">Sort: Name</option>
            <option value="qty">Sort: Qty</option>
          </select>
          <span style={{ fontFamily: F.body, fontSize: 12, color: "#64748b", display: "flex", alignItems: "center" }}>{items.length} items</span>
        </div>
      )}

      {showForm && (
        <div ref={el => { if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 50); }}>
        <ItemForm item={editing} activeGroup={activeGroup} onSave={async (data) => {
          if (editing) await onUpdate(editing.id, data);
          else await onAdd(data);
          setShowForm(false); setEditing(null);
        }} onCancel={() => { setShowForm(false); setEditing(null); }} />
        </div>
      )}

      {/* ── SPREADSHEET VIEW FOR AIR FILTERS ── */}
      {isFilterGroup && (
        <div style={{ marginTop: 8 }}>
          <div style={{ fontFamily: F.body, fontSize: 12, color: "#64748b", marginBottom: 10 }}>{items.length} filters</div>
          <div style={{ border: "1px solid #e2e8f0", borderRadius: 8, overflow: "hidden", overflowX: "auto" }}>
            {/* Table Header */}
            <div style={{ display: "grid", gridTemplateColumns: "minmax(100px,1.5fr) 55px minmax(100px,1.5fr) 55px 45px 50px 50px 50px", background: "#f1f5f9", padding: "6px 8px", borderBottom: "2px solid #cbd5e1", gap: 4, minWidth: 560 }}>
              {["Unit ID","Units","Filter Size","Per Unit","Total","Stock","Order","+/−"].map(h => (
                <span key={h} style={{ fontFamily: F.heading, fontSize: 9, color: "#475569", fontWeight: 700, textTransform: "uppercase", letterSpacing: ".3px", textAlign: h === "Unit ID" || h === "Filter Size" ? "left" : "center" }}>{h}</span>
              ))}
            </div>
            {(() => {
              // Group items by filter size (name)
              const groups = [];
              const seen = {};
              items.forEach(i => {
                if (!seen[i.name]) { seen[i.name] = []; groups.push(i.name); }
                seen[i.name].push(i);
              });
              let rowIdx = 0;
              return groups.map(filterSize => {
                const groupItems = seen[filterSize];
                const sumTotal = groupItems.reduce((s, i) => s + (i.totalNeeded || 0), 0);
                const sumStock = groupItems.reduce((s, i) => s + (i.qty || 0), 0);
                const sumOrder = groupItems.reduce((s, i) => {
                  const t = i.totalNeeded || 0;
                  return s + (t > 0 ? Math.max(0, (t * 2) - (i.qty || 0)) : 0);
                }, 0);
                return (
                  <div key={filterSize}>
                    {groupItems.map(i => {
                      const total = i.totalNeeded || 0;
                      const stock = i.qty || 0;
                      const order = total > 0 ? Math.max(0, (total * 2) - stock) : 0;
                      const isLow = total > 0 && stock < total;
                      const isOut = total > 0 && stock === 0;
                      const rowBg = rowIdx % 2 === 0 ? "#fff" : "#fafbfc";
                      rowIdx++;
                      return (
                        <div key={i.id}>
                          <div style={{ display: "grid", gridTemplateColumns: "minmax(100px,1.5fr) 55px minmax(100px,1.5fr) 55px 45px 50px 50px 50px", padding: "8px 8px", borderBottom: "1px solid #f1f5f9", alignItems: "start", background: expanded === i.id ? "#f0fdfa" : rowBg, cursor: "pointer", gap: 4, minWidth: 560 }}
                            onClick={() => setExpanded(expanded === i.id ? null : i.id)}>
                            <div style={{ fontFamily: F.body, fontSize: 12, color: "#334155", fontWeight: 600, lineHeight: 1.4, wordBreak: "break-word" }}>
                              {(i.unitId || "—").split(/,\s*/).map((unit, ui) => (
                                <div key={ui} style={{ padding: "1px 0" }}>{unit.trim()}</div>
                              ))}
                            </div>
                            <div style={{ fontFamily: F.mono, fontSize: 12, color: "#64748b", textAlign: "center" }}>{i.qtyUnits || "—"}</div>
                            <div style={{ fontFamily: F.heading, fontSize: 12, color: "#0f172a", fontWeight: 600 }}>{i.name}</div>
                            <div style={{ fontFamily: F.mono, fontSize: typeof i.qtyPerUnit === "string" && i.qtyPerUnit.includes("/") ? 10 : 12, color: "#64748b", textAlign: "center", lineHeight: 1.2 }}>{i.qtyPerUnit || "—"}</div>
                            <div style={{ fontFamily: F.mono, fontSize: 13, color: "#334155", textAlign: "center", fontWeight: 700 }}>{total || "—"}</div>
                            {editingQty?.id === i.id ? (
                              <div style={{ textAlign: "center" }} onClick={e => e.stopPropagation()}>
                                <input type="number" min="0" autoFocus
                                  style={{ fontFamily: F.mono, fontSize: 13, width: 46, textAlign: "center", border: "2px solid #0d9488", borderRadius: 4, padding: "1px 0", outline: "none", color: "#0f172a", background: "#f0fdfa", fontWeight: 700 }}
                                  value={editingQty.value}
                                  onChange={e => setEditingQty({ ...editingQty, value: e.target.value })}
                                  onBlur={() => { const v = Math.max(0, parseInt(editingQty.value) || 0); onUpdate(i.id, { qty: v }); setEditingQty(null); }}
                                  onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }} />
                              </div>
                            ) : (
                              <div style={{ fontFamily: F.mono, fontSize: 13, textAlign: "center", fontWeight: 700, color: isOut ? "#ef4444" : isLow ? "#f59e0b" : "#16a34a", cursor: "pointer" }}
                                onClick={e => { e.stopPropagation(); setEditingQty({ id: i.id, value: String(stock) }); }}>{stock}</div>
                            )}
                            <div style={{ fontFamily: F.mono, fontSize: 13, textAlign: "center", fontWeight: 700, color: order > 0 ? "#dc2626" : "#94a3b8", background: order > 0 ? "#fef2f2" : "transparent", borderRadius: 4, padding: "2px 0" }}>{order || "—"}</div>
                            <div style={{ display: "flex", gap: 2, justifyContent: "center" }} onClick={e => e.stopPropagation()}>
                              <button style={{ ...S.qtyBtn, width: 22, height: 22, fontSize: 12, borderRadius: 6 }} onClick={() => onAdjust(i.id, -1)}>−</button>
                              <button style={{ ...S.qtyBtn, width: 22, height: 22, fontSize: 12, borderRadius: 6 }} onClick={() => onAdjust(i.id, 1)}>+</button>
                            </div>
                          </div>
                          {expanded === i.id && (
                            <div style={{ padding: "10px 12px 14px", background: "#f8fafc", borderBottom: "1px solid #e2e8f0" }}>
                              {inlineEdit?.id === i.id ? (
                                <>
                                  <label style={S.label}>Filter Size (Name)</label>
                                  <input style={S.input} value={inlineEdit.name} onChange={e => setInlineEdit({ ...inlineEdit, name: e.target.value })} />
                                  <label style={S.label}>Notes</label>
                                  <textarea style={{ ...S.input, minHeight: 50, resize: "vertical", marginBottom: 0 }} value={inlineEdit.notes} onChange={e => setInlineEdit({ ...inlineEdit, notes: e.target.value })} placeholder="Add notes…" />
                                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                                    <button style={{ ...S.btnPrimary, width: "auto", padding: "8px 16px" }} onClick={() => { if (inlineEdit.name.trim()) { onUpdate(i.id, { name: inlineEdit.name, notes: inlineEdit.notes }); setInlineEdit(null); } }}>Save</button>
                                    <button style={S.btnSecondary} onClick={() => setInlineEdit(null)}>Cancel</button>
                                  </div>
                                </>
                              ) : (
                                <>
                                  <p style={S.detailLine}><b>Unit ID:</b> {i.unitId || "—"}</p>
                                  <p style={S.detailLine}><b># of Units:</b> {i.qtyUnits || "—"}</p>
                                  <p style={S.detailLine}><b>Filter Size:</b> {i.name}</p>
                                  <p style={S.detailLine}><b>Qty Per Unit:</b> {i.qtyPerUnit || "—"}</p>
                                  <p style={S.detailLine}><b>Total Needed:</b> {total}</p>
                                  <p style={S.detailLine}><b>In Stock:</b> {stock}</p>
                                  <p style={S.detailLine}><b>Order (Total×2 − Stock):</b> <span style={{ color: order > 0 ? "#dc2626" : "#16a34a", fontWeight: 700 }}>{order}</span></p>
                                  {i.notes && <p style={S.detailLine}><b>Notes:</b> {i.notes}</p>}
                                  <p style={S.detailLine}><b>Last updated:</b> {new Date(i.lastUpdated).toLocaleDateString()} {i.updatedBy ? `by ${i.updatedBy}` : ""}</p>
                                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                                    <button style={S.btnSecondary} onClick={() => setInlineEdit({ id: i.id, name: i.name, notes: i.notes || "" })}>✏️ Edit</button>
                                    {isAdmin && <button style={S.btnSecondary} onClick={() => { setEditing(i); setShowForm(true); }}>Full Edit</button>}
                                    {isAdmin && confirmDelItem !== i.id && <button style={{ ...S.btnSecondary, color: "#ef4444", borderColor: "#fca5a5" }} onClick={() => setConfirmDelItem(i.id)}>Delete</button>}
                                    {isAdmin && confirmDelItem === i.id && (
                                      <>
                                        <button style={{ ...S.btnSecondary, color: "#ef4444", borderColor: "#fca5a5" }} onClick={() => { onDelete(i.id); setConfirmDelItem(null); setExpanded(null); }}>Yes, Delete</button>
                                        <button style={S.btnSecondary} onClick={() => setConfirmDelItem(null)}>Cancel</button>
                                      </>
                                    )}
                                  </div>
                                </>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                    {/* Subtotal row for this filter size */}
                    <div style={{ display: "grid", gridTemplateColumns: "minmax(100px,1.5fr) 55px minmax(100px,1.5fr) 55px 45px 50px 50px 50px", padding: "6px 8px", background: "#1e293b", gap: 4, minWidth: 560, borderBottom: "3px solid #0d9488" }}>
                      <div style={{ gridColumn: "1 / 4", fontFamily: F.heading, fontSize: 11, color: "#94a3b8", fontWeight: 700 }}>SUBTOTAL: {filterSize}</div>
                      <div></div>
                      <div style={{ fontFamily: F.mono, fontSize: 12, color: "#fff", textAlign: "center", fontWeight: 800 }}>{sumTotal}</div>
                      <div style={{ fontFamily: F.mono, fontSize: 12, color: "#4ade80", textAlign: "center", fontWeight: 800 }}>{sumStock}</div>
                      <div style={{ fontFamily: F.mono, fontSize: 12, color: sumOrder > 0 ? "#f87171" : "#4ade80", textAlign: "center", fontWeight: 800 }}>{sumOrder || "—"}</div>
                      <div></div>
                    </div>
                  </div>
                );
              });
            })()}
          </div>
          <button style={{ width: "100%", padding: "14px", marginTop: 12, background: "linear-gradient(135deg, #0d9488, #0f766e)", border: "none", borderRadius: 10, color: "#fff", fontFamily: F.heading, fontSize: 14, fontWeight: 700, cursor: "pointer", letterSpacing: ".5px", boxShadow: "0 4px 16px rgba(13,148,136,0.3)" }}
            onClick={exportAndEmail}>📧 Export & Email Report</button>
          {isAdmin && (
            <button style={{ width: "100%", padding: "14px", marginTop: 12, background: "#dc2626", border: "none", borderRadius: 10, color: "#fff", fontFamily: F.heading, fontSize: 14, fontWeight: 700, cursor: "pointer", letterSpacing: ".5px", transition: "opacity .2s" }}
              onClick={() => {
                if (confirm("⚠️ Reset ALL stock quantities to 0 for " + selectedGroup + "?\n\nThis cannot be undone.")) {
                  onResetStock(new Set(items.map(i => i.id)));
                }
              }}>🗑 Reset All Stock to Zero</button>
          )}
          <div style={{ height: 80 }} />
        </div>
      )}

      {/* ── SPREADSHEET VIEW FOR NON-FILTER GROUPS ── */}
      {!isFilterGroup && (() => {
        const hasPhotos = selectedGroup === "Plumbing" || selectedGroup === "Faucet Parts";
        const gridCols = hasPhotos
          ? "50px minmax(100px,1.5fr) minmax(70px,1fr) minmax(80px,1.2fr) 50px 50px"
          : "minmax(120px,2fr) minmax(80px,1fr) minmax(100px,1.5fr) 50px 50px";
        const headers = hasPhotos
          ? ["Photo","Item","Part #","Description","Stock","+/−"]
          : ["Item","Part #","Description","Stock","+/−"];
        const minW = hasPhotos ? 470 : 420;
        return (
        <div style={{ marginTop: 8 }}>
          <div style={{ fontFamily: F.body, fontSize: 12, color: "#64748b", marginBottom: 10 }}>{items.length} items</div>
          <div style={{ border: "1px solid #e2e8f0", borderRadius: 8, overflow: "hidden", overflowX: "auto" }}>
            {/* Table Header */}
            <div style={{ display: "grid", gridTemplateColumns: gridCols, background: "#f1f5f9", padding: "6px 8px", borderBottom: "2px solid #cbd5e1", gap: 4, minWidth: minW }}>
              {headers.map(h => (
                <span key={h} style={{ fontFamily: F.heading, fontSize: 9, color: "#475569", fontWeight: 700, textTransform: "uppercase", letterSpacing: ".3px", textAlign: h === "Item" || h === "Part #" || h === "Description" || h === "Photo" ? "left" : "center" }}>{h}</span>
              ))}
            </div>
            {items.map((i, idx) => {
              const stock = i.qty || 0;
              const rowBg = idx % 2 === 0 ? "#fff" : "#fafbfc";
              const imgQuery = i.partNumber ? encodeURIComponent(i.partNumber + " " + (i.name || "")) : "";
              const imgUrl = i.partNumber ? "https://www.google.com/search?tbm=isch&q=" + imgQuery : "";
              return (
                <div key={i.id}>
                  <div style={{ display: "grid", gridTemplateColumns: gridCols, padding: "6px 8px", borderBottom: "1px solid #f1f5f9", alignItems: "center", background: expanded === i.id ? "#f0fdfa" : rowBg, cursor: "pointer", gap: 4, minWidth: minW }}
                    onClick={() => setExpanded(expanded === i.id ? null : i.id)}>
                    {hasPhotos && (
                      <div style={{ width: 44, height: 44, borderRadius: 6, overflow: "hidden", background: "#f1f5f9", border: "1.5px solid #e2e8f0", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, cursor: "pointer" }}
                        onClick={e => {
                          e.stopPropagation();
                          if (i.photo) {
                            setExpanded(expanded === i.id ? null : i.id);
                          } else if (i.partNumber) {
                            window.open("https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(i.partNumber + " " + (i.name || "")), "_blank");
                          }
                        }}>
                        {i.photo ? (
                          <img src={i.photo} style={{ width: 44, height: 44, objectFit: "cover" }}
                            onError={e => { e.target.onerror = null; e.target.style.display = "none"; e.target.parentElement.innerHTML = '<span style="font-size:18px">📷</span>'; }}
                            alt="" />
                        ) : (
                          <span style={{ fontSize: 16, color: "#94a3b8" }}>{i.partNumber ? (i.photoFailed ? "📷" : "⏳") : "—"}</span>
                        )}
                      </div>
                    )}
                    <div style={{ fontFamily: F.heading, fontSize: 12, color: "#0f172a", fontWeight: 600, lineHeight: 1.3, wordBreak: "break-word" }}>{i.name}</div>
                    <div style={{ fontFamily: F.mono, fontSize: 11, color: "#64748b" }}>{i.partNumber || "—"}</div>
                    <div style={{ fontFamily: F.body, fontSize: 11, color: "#64748b", lineHeight: 1.3 }}>{i.notes || "—"}</div>
                    {editingQty?.id === i.id ? (
                      <div style={{ textAlign: "center" }} onClick={e => e.stopPropagation()}>
                        <input type="number" min="0" autoFocus
                          style={{ fontFamily: F.mono, fontSize: 13, width: 46, textAlign: "center", border: "2px solid #0d9488", borderRadius: 4, padding: "1px 0", outline: "none", color: "#0f172a", background: "#f0fdfa", fontWeight: 700 }}
                          value={editingQty.value}
                          onChange={e => setEditingQty({ ...editingQty, value: e.target.value })}
                          onBlur={() => { const v = Math.max(0, parseInt(editingQty.value) || 0); onUpdate(i.id, { qty: v }); setEditingQty(null); }}
                          onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }} />
                      </div>
                    ) : (
                      <div style={{ fontFamily: F.mono, fontSize: 13, textAlign: "center", fontWeight: 700, color: stock === 0 ? "#ef4444" : stock <= (i.minQty || 0) && (i.minQty || 0) > 0 ? "#f59e0b" : "#16a34a", cursor: "pointer" }}
                        onClick={e => { e.stopPropagation(); setEditingQty({ id: i.id, value: String(stock) }); }}>{stock}</div>
                    )}
                    <div style={{ display: "flex", gap: 2, justifyContent: "center" }} onClick={e => e.stopPropagation()}>
                      <button style={{ ...S.qtyBtn, width: 22, height: 22, fontSize: 12, borderRadius: 6 }} onClick={() => onAdjust(i.id, -1)}>−</button>
                      <button style={{ ...S.qtyBtn, width: 22, height: 22, fontSize: 12, borderRadius: 6 }} onClick={() => onAdjust(i.id, 1)}>+</button>
                    </div>
                  </div>
                  {expanded === i.id && (
                    <div style={{ padding: "10px 12px 14px", background: "#f8fafc", borderBottom: "1px solid #e2e8f0" }}>
                      {inlineEdit?.id === i.id ? (
                        <>
                          <label style={S.label}>Name</label>
                          <input style={S.input} value={inlineEdit.name} onChange={e => setInlineEdit({ ...inlineEdit, name: e.target.value })} />
                          <label style={S.label}>Description / Notes</label>
                          <textarea style={{ ...S.input, minHeight: 50, resize: "vertical", marginBottom: 0 }} value={inlineEdit.notes} onChange={e => setInlineEdit({ ...inlineEdit, notes: e.target.value })} placeholder="Add description…" />
                          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                            <button style={{ ...S.btnPrimary, width: "auto", padding: "8px 16px" }} onClick={() => { if (inlineEdit.name.trim()) { onUpdate(i.id, { name: inlineEdit.name, notes: inlineEdit.notes }); setInlineEdit(null); } }}>Save</button>
                            <button style={S.btnSecondary} onClick={() => setInlineEdit(null)}>Cancel</button>
                          </div>
                        </>
                      ) : (
                        <>
                          {hasPhotos && (
                            <div style={{ marginBottom: 10 }}>
                              {i.photo && (
                                <div style={{ marginBottom: 8 }}>
                                  <img src={i.photo} style={{ width: "100%", maxWidth: 200, borderRadius: 8, border: "1px solid #e2e8f0" }} alt="" />
                                </div>
                              )}
                              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                                <label style={{ ...S.btnSecondary, display: "inline-flex", alignItems: "center", gap: 4, margin: 0, cursor: "pointer" }}>
                                  📷 {i.photo ? "Change" : "Add"} Photo
                                  <input type="file" accept="image/*" capture="environment" style={{ display: "none" }}
                                    onChange={e => {
                                      const file = e.target.files[0];
                                      if (!file) return;
                                      const reader = new FileReader();
                                      reader.onload = ev => {
                                        // Resize to max 200px to keep storage small
                                        const img = new Image();
                                        img.onload = () => {
                                          const canvas = document.createElement("canvas");
                                          const max = 200;
                                          let w = img.width, h = img.height;
                                          if (w > h) { h = h * max / w; w = max; } else { w = w * max / h; h = max; }
                                          canvas.width = w; canvas.height = h;
                                          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                                          const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
                                          onUpdate(i.id, { photo: dataUrl });
                                        };
                                        img.src = ev.target.result;
                                      };
                                      reader.readAsDataURL(file);
                                    }} />
                                </label>
                                {i.partNumber && (
                                  <a href={"https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(i.partNumber + " " + (i.name || ""))} target="_blank" rel="noopener"
                                    style={{ ...S.btnSecondary, display: "inline-flex", alignItems: "center", gap: 4, textDecoration: "none", color: "#0d9488" }}>
                                    🔍 Google #{i.partNumber}
                                  </a>
                                )}
                                {i.photo && (
                                  <button style={{ ...S.btnSecondary, color: "#ef4444", borderColor: "#fca5a5" }}
                                    onClick={() => onUpdate(i.id, { photo: null })}>✕ Remove</button>
                                )}
                              </div>
                            </div>
                          )}
                          {i.partNumber && <p style={S.detailLine}><b>Part #:</b> {i.partNumber}</p>}
                          {i.location && <p style={S.detailLine}><b>Location:</b> {i.location}</p>}
                          {i.minQty > 0 && <p style={S.detailLine}><b>Min stock:</b> {i.minQty}</p>}
                          {i.notes && <p style={S.detailLine}><b>Notes:</b> {i.notes}</p>}
                          <p style={S.detailLine}><b>Last updated:</b> {new Date(i.lastUpdated).toLocaleDateString()} {i.updatedBy ? `by ${i.updatedBy}` : ""}</p>
                          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                            <button style={S.btnSecondary} onClick={() => setInlineEdit({ id: i.id, name: i.name, notes: i.notes || "" })}>✏️ Edit</button>
                            {isAdmin && <button style={S.btnSecondary} onClick={() => { setEditing(i); setShowForm(true); }}>Full Edit</button>}
                            {isAdmin && confirmDelItem !== i.id && <button style={{ ...S.btnSecondary, color: "#ef4444", borderColor: "#fca5a5" }} onClick={() => setConfirmDelItem(i.id)}>Delete</button>}
                            {isAdmin && confirmDelItem === i.id && (
                              <>
                                <button style={{ ...S.btnSecondary, color: "#ef4444", borderColor: "#fca5a5" }} onClick={() => { onDelete(i.id); setConfirmDelItem(null); setExpanded(null); }}>Yes, Delete</button>
                                <button style={S.btnSecondary} onClick={() => setConfirmDelItem(null)}>Cancel</button>
                              </>
                            )}
                          </div>
                        </>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          {items.length === 0 && <p style={{ fontFamily: F.body, fontSize: 13, color: "#64748b", textAlign: "center", padding: 32 }}>No items in this group{search ? " matching your search" : ""}.</p>}
          {isAdmin && (
            <button style={{ width: "100%", padding: "14px", marginTop: 12, background: "#dc2626", border: "none", borderRadius: 10, color: "#fff", fontFamily: F.heading, fontSize: 14, fontWeight: 700, cursor: "pointer", letterSpacing: ".5px", transition: "opacity .2s" }}
              onClick={() => {
                if (confirm("⚠️ Reset ALL stock quantities to 0 for " + selectedGroup + "?\n\nThis cannot be undone.")) {
                  onResetStock(new Set(items.map(i => i.id)));
                }
              }}>🗑 Reset All Stock to Zero</button>
          )}
          <div style={{ height: 80 }} />
        </div>
        );
      })()}
    </div>
  );
}

function ItemForm({ item, activeGroup, onSave, onCancel }) {
  const isFilter = activeGroup?.startsWith("Air Filters");
  const [f, setF] = useState({
    name: item?.name || "", group: item?.group || activeGroup, qty: item?.qty ?? 1,
    minQty: item?.minQty ?? 0, partNumber: item?.partNumber || "", location: item?.location || "",
    notes: item?.notes || "",
    ...(isFilter ? {
      unitId: item?.unitId || "",
      qtyUnits: item?.qtyUnits ?? 0,
      qtyPerUnit: item?.qtyPerUnit ?? 0,
      totalNeeded: item?.totalNeeded ?? 0,
    } : {}),
  });

function UserForm({ user, onSave, onCancel }) {
  const [f, setF] = useState({ username: user?.username || "", displayName: user?.displayName || "", email: user?.email || "", role: user?.role || "crew", password: "" });
  const [emailTouched, setEmailTouched] = useState(false);
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));

  const autoUsername = (name) => {
    const parts = name.trim().split(/\s+/);
    if (parts.length < 2) return parts[0]?.toLowerCase() || "";
    return (parts[0][0] + parts[parts.length - 1]).toLowerCase();
  };

  const autoEmail = (name) => {
    const parts = name.trim().split(/\s+/).filter(Boolean);
    if (parts.length < 2) return parts[0] ? parts[0].toLowerCase() + "@versantmedia.com" : "";
    return (parts[0] + "." + parts[parts.length - 1]).toLowerCase() + "@versantmedia.com";
  };

  const handleNameChange = (val) => {
    set("displayName", val);
    if (!user) {
      set("username", autoUsername(val));
      if (!emailTouched) set("email", autoEmail(val));
    }
  };

  const handleEmailChange = (val) => {
    setEmailTouched(true);
    set("email", val);
  };

  const genPassword = () => {
    const chars = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
    let pw = "";
    for (let i = 0; i < 8; i++) pw += chars[Math.floor(Math.random() * chars.length)];
    set("password", pw);
  };

  const handleSave = () => {
    if (!f.displayName.trim() || !f.username.trim()) return;
    if (!user && f.password.length < 4) return;
    onSave(f);
  };

  return (
    <div style={{ ...S.card, border: "1.5px solid #e2e8f0", marginBottom: 12 }}>
      <h3 style={{ fontFamily: F.heading, fontSize: 15, color: "#1e293b", margin: "0 0 12px" }}>{user ? "Edit User" : "New User"}</h3>
      <label style={S.label}>Full Name *</label>
      <input style={S.input} value={f.displayName} onChange={e => handleNameChange(e.target.value)} placeholder="e.g. John Smith" />
      <label style={S.label}>Username {!user && <span style={{ color: "#64748b", fontWeight: 400 }}>(auto-generated)</span>}</label>
      <input style={{ ...S.input, background: !user ? "#141c2e" : "#1e293b" }} value={f.username} onChange={e => set("username", e.target.value)} placeholder="login username" autoCapitalize="off" disabled={!!user} />
      <label style={S.label}>Email {!user && <span style={{ color: "#64748b", fontWeight: 400 }}>(auto-generated)</span>}</label>
      <input style={S.input} type="email" value={f.email} onChange={e => handleEmailChange(e.target.value)} placeholder="firstname.lastname@versantmedia.com" autoCapitalize="off" />
      {!user && (
        <div style={{ display: "flex", alignItems: "flex-end", gap: 8 }}>
          <div style={{ flex: 1 }}>
            <label style={S.label}>Temporary Password *</label>
            <input style={S.input} type="text" value={f.password} onChange={e => set("password", e.target.value)} placeholder="Min 4 characters" />
          </div>
          <button style={{ ...S.btnSecondary, marginBottom: 0, padding: "10px 12px", whiteSpace: "nowrap" }} onClick={genPassword} title="Generate random password">🎲 Gen</button>
        </div>
      )}
      <label style={S.label}>Role</label>
      <select style={S.select} value={f.role} onChange={e => set("role", e.target.value)}><option value="crew">Crew</option><option value="admin">Admin</option></select>
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <button style={S.btnPrimary} onClick={handleSave}>Save</button>
        <button style={S.btnSecondary} onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function ProfileView({ user, onChangePw, mustReset }) {
  const [pw1, setPw1] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const submit = () => {
    if (pw1.length < 4) return setErr("Minimum 4 characters.");
    if (pw1 !== pw2) return setErr("Passwords don't match.");
    setErr("");
    onChangePw(pw1);
  };
  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>{mustReset ? "Set New Password" : "My Profile"}</h2>
      <div style={S.card}>
        <p style={{ fontFamily: F.body, fontSize: 13, color: "#64748b", margin: "0 0 4px" }}>Signed in as</p>

  );
}

function LogsView({ logs }) {
  const [filter, setFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [dateRange, setDateRange] = useState("all"); // all | today | week | month

  const actionTypes = ["All", "Login", "Logout", "Qty Changed", "Item Added", "Item Updated", "Item Deleted", "User Created", "User Updated", "User Deleted", "Password Reset", "Password Changed"];

  const now = new Date();
  const filtered = logs.filter(l => {
    if (filter !== "All" && l.action !== filter) return false;
    if (search && !l.detail.toLowerCase().includes(search.toLowerCase()) && !l.user.toLowerCase().includes(search.toLowerCase())) return false;
    if (dateRange !== "all") {
      const d = new Date(l.ts);
      if (dateRange === "today") {
        if (d.toDateString() !== now.toDateString()) return false;
      } else if (dateRange === "week") {
        const week = 7 * 24 * 60 * 60 * 1000;
        if (now - d > week) return false;
      } else if (dateRange === "month") {
        const month = 30 * 24 * 60 * 60 * 1000;
        if (now - d > month) return false;
      }
    }
    return true;
  });

  const actionColor = (a) => {
    if (a === "Login" || a === "Logout") return "#38bdf8";
    if (a.includes("Deleted")) return "#ef4444";
    if (a.includes("Created") || a.includes("Added")) return "#4ade80";
    if (a.includes("Changed") || a.includes("Updated") || a.includes("Reset")) return "#f59e0b";
    return "#94a3b8";
  };

  const formatTime = (ts) => {
    const d = new Date(ts);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    const isYesterday = d.toDateString() === yesterday.toDateString();
    const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (isToday) return `Today ${time}`;
    if (isYesterday) return `Yesterday ${time}`;
    return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ` ${time}`;
  };

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>Activity Log</h2>

      <input style={{ ...S.input, marginBottom: 8 }} value={search} onChange={e => setSearch(e.target.value)} placeholder="Search logs…" />
      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <select style={S.select} value={filter} onChange={e => setFilter(e.target.value)}>
          {actionTypes.map(a => <option key={a} value={a}>{a}</option>)}
        </select>
        <select style={S.select} value={dateRange} onChange={e => setDateRange(e.target.value)}>
          <option value="all">All Time</option>
          <option value="today">Today</option>
          <option value="week">Last 7 Days</option>
          <option value="month">Last 30 Days</option>
        </select>
      </div>

      <p style={{ fontFamily: F.body, fontSize: 12, color: "#64748b", marginBottom: 8 }}>{filtered.length} entries</p>

      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
        {filtered.map(l => (
          <div key={l.id} style={{ background: "#ffffff", borderRadius: 10, padding: "11px 14px", boxShadow: "0 1px 2px rgba(0,0,0,0.04)", border: "1px solid #f1f5f9" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                  <span style={{ fontFamily: F.body, fontSize: 11, fontWeight: 600, color: actionColor(l.action), background: actionColor(l.action) + "18", padding: "2px 8px", borderRadius: 10 }}>{l.action}</span>
                  <span style={{ fontFamily: F.body, fontSize: 11, color: "#64748b" }}>{l.user}</span>
                </div>
                <p style={{ fontFamily: F.body, fontSize: 13, color: "#334155", margin: 0 }}>{l.detail}</p>
              </div>
              <span style={{ fontFamily: F.mono, fontSize: 10, color: "#64748b", whiteSpace: "nowrap", marginTop: 2 }}>{formatTime(l.ts)}</span>
            </div>
          </div>
        ))}
        {filtered.length === 0 && <p style={{ fontFamily: F.body, fontSize: 13, color: "#64748b", textAlign: "center", padding: 32 }}>No log entries{filter !== "All" || search ? " match your filters" : " yet"}.</p>}
      </div>
      <div style={{ height: 80 }} />
    </div>
  );
}
