<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PM Records — HVAC Engineering</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1B3A5C;--navy-light:#2A5280;--accent:#2979FF;--bg:#F3F6FA;--card:#FFFFFF;--border:#D4DCE8;--text:#1E2A3A;--text-mid:#5A6A7E;--text-light:#8A96A8;--success:#2E7D32;--danger:#C62828;--warn:#E65100;--radius:12px;--radius-sm:8px;--shadow:0 2px 12px rgba(27,58,92,0.08)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
  .header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(27,58,92,.25);display:flex;align-items:center;gap:12px}
  .header h1{font-size:17px;font-weight:700;letter-spacing:.5px;flex:1}
  .back-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 14px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:4px}
  .container{padding:16px;max-width:600px;margin:0 auto;padding-bottom:40px}
  .breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:var(--text-mid)}
  .breadcrumb a{color:var(--accent);text-decoration:none;font-weight:600}
  .breadcrumb span{color:var(--text-light)}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;margin-bottom:10px}
  .card-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .15s;text-decoration:none;color:var(--text)}
  .card-btn:active{background:#f0f4f8}
  .card-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .card-icon.year{background:#E8F0FE}
  .card-icon.month{background:#FFF8E1}
  .card-icon.pm{background:#E8F5E9}
  .card-info{flex:1}
  .card-title{font-size:15px;font-weight:700;color:var(--text)}
  .card-sub{font-size:12px;color:var(--text-mid);margin-top:2px}
  .card-arrow{font-size:18px;color:var(--text-light)}
  .loading{text-align:center;padding:40px;color:var(--text-mid);font-size:14px}
  .empty{text-align:center;padding:40px;color:var(--text-light);font-size:14px}
  .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-left:6px}
  .badge-followup{background:#FEF2F2;color:#DC2626}
  .badge-repair{background:#FFF8E1;color:#E65100}
  
  /* PM Detail View */
  .detail-section{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
  .detail-header{background:var(--navy);color:#fff;padding:12px 16px;font-size:13px;font-weight:700;letter-spacing:.5px}
  .detail-body{padding:16px}
  .detail-row{display:flex;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
  .detail-row:last-child{border-bottom:none}
  .detail-label{width:120px;color:var(--text-mid);font-size:13px;flex-shrink:0}
  .detail-value{flex:1;font-weight:600;color:var(--text)}
  .followup-banner{background:#FEF2F2;border:2px solid #DC2626;border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;text-align:center}
  .followup-banner .title{font-size:14px;font-weight:800;color:#DC2626}
  .followup-banner .notes{font-size:13px;color:#7F1D1D;margin-top:6px}
  .checklist-task{padding:4px 0;font-size:13px;color:#334155}
  .findings-box{margin-top:8px;padding:8px;background:#FFF8E1;border-radius:6px;border:1px solid #FFE082;font-size:13px;color:#92400E}
  .safety-row{padding:3px 0;font-size:12px}
  .safety-section-label{font-size:11px;font-weight:700;color:var(--text-mid);text-transform:uppercase;margin:8px 0 4px;letter-spacing:.5px}
  .resend-btn{width:100%;padding:12px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
  .resend-btn:active{transform:scale(.97)}
  .footer{text-align:center;padding:20px;font-size:11px;color:var(--text-light)}
</style>
</head>
<body>
<div class="header">
  <a href="/" class="back-btn">← Menu</a>
  <h1>📁 PM Records</h1>
</div>
<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="content"><div class="loading">Loading…</div></div>
</div>
<div class="footer" id="footer"></div>

<script>
document.getElementById('footer').textContent = '© ' + new Date().getFullYear() + ' Local 68 — HVAC Engineering Department';

// Session check + auto-logout
const TIMEOUT_MS = 10 * 60 * 1000;
function resetActivityTimer() { localStorage.setItem('hvac_last_activity', Date.now().toString()); }
function checkInactivity() {
  const last = parseInt(localStorage.getItem('hvac_last_activity') || '0');
  const sess = localStorage.getItem('hvac_session');
  if (sess && last && (Date.now() - last > TIMEOUT_MS)) {
    localStorage.removeItem('hvac_session');
    localStorage.removeItem('hvac_last_activity');
    alert('Session expired — please sign in again.');
    window.location.href = '/';
  }
  if (!sess) { window.location.href = '/'; }
}
['click','touchstart','keydown','scroll','mousemove'].forEach(evt => document.addEventListener(evt, resetActivityTimer, { passive: true }));
setInterval(checkInactivity, 30000);
resetActivityTimer();
if (!localStorage.getItem('hvac_session')) { window.location.href = '/'; }
const _currentUser = JSON.parse(localStorage.getItem('hvac_session') || '{}');

// State
let currentPath = []; // e.g. [] = years, ['2026'] = months, ['2026','04-April'] = PMs

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let parts = ['<a href="#" onclick="navigate([]);return false;">All Years</a>'];
  currentPath.forEach((p, i) => {
    const sub = currentPath.slice(0, i + 1);
    if (i < currentPath.length - 1) {
      parts.push('<span>›</span>');
      parts.push('<a href="#" onclick="navigate(' + JSON.stringify(sub) + ');return false;">' + p + '</a>');
    } else {
      parts.push('<span>›</span>');
      parts.push('<span style="color:var(--text);font-weight:600;">' + p + '</span>');
    }
  });
  bc.innerHTML = parts.join('');
}

async function navigate(path) {
  currentPath = path;
  updateBreadcrumb();
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading…</div>';

  if (path.length === 0) {
    // Show years
    const res = await fetch('/api/pm-records');
    const data = await res.json();
    if (!data.items.length) { content.innerHTML = '<div class="empty">No PM records yet.</div>'; return; }
    content.innerHTML = data.items.map(year => 
      '<div class="card"><a class="card-btn" href="#" onclick="navigate([\'' + year + '\']);return false;">' +
      '<div class="card-icon year">📅</div>' +
      '<div class="card-info"><div class="card-title">' + year + '</div><div class="card-sub">Click to view months</div></div>' +
      '<div class="card-arrow">›</div></a></div>'
    ).join('');
  } else if (path.length === 1) {
    // Show months
    const res = await fetch('/api/pm-records/' + path[0]);
    const data = await res.json();
    if (!data.items.length) { content.innerHTML = '<div class="empty">No records for ' + path[0] + '.</div>'; return; }
    content.innerHTML = data.items.map(month => {
      const label = month.replace(/^\d+-/, '');
      return '<div class="card"><a class="card-btn" href="#" onclick="navigate([\'' + path[0] + '\',\'' + month + '\']);return false;">' +
        '<div class="card-icon month">📂</div>' +
        '<div class="card-info"><div class="card-title">' + label + '</div><div class="card-sub">' + path[0] + '</div></div>' +
        '<div class="card-arrow">›</div></a></div>';
    }).join('');
  } else if (path.length === 2) {
    // Show individual PMs
    const res = await fetch('/api/pm-records/' + path[0] + '/' + path[1]);
    const data = await res.json();
    if (!data.items.length) { content.innerHTML = '<div class="empty">No PMs for this month.</div>'; return; }
    content.innerHTML = data.items.map(file => {
      const parts = file.split('_');
      const day = parts[0] || '';
      const rest = parts.slice(1).join(' ').replace(/_/g, ' ');
      const isRepair = file.includes('Repair');
      const isFollowup = file.toLowerCase().includes('followup');
      let badges = '';
      if (isRepair) badges += '<span class="badge badge-repair">Repair</span>';
      return '<div class="card"><a class="card-btn" href="#" onclick="viewPM(\'' + path[0] + '\',\'' + path[1] + '\',\'' + file + '\');return false;">' +
        '<div class="card-icon pm">📋</div>' +
        '<div class="card-info"><div class="card-title">' + rest + badges + '</div><div class="card-sub">Day ' + day + ' · ' + path[1].replace(/^\d+-/, '') + ' ' + path[0] + '</div></div>' +
        '<div class="card-arrow">›</div></a></div>';
    }).join('');
  }
}

async function viewPM(year, month, file) {
  currentPath = [year, month, file];
  updateBreadcrumb();
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading PM record…</div>';

  try {
    const res = await fetch('/api/pm-records/' + year + '/' + month + '/' + file);
    if (!res.ok) { content.innerHTML = '<div class="empty">Could not load this record.</div>'; return; }
    const pm = await res.json();

    let html = '';

    // Follow-up banner
    if (pm.followUp) {
      html += '<div class="followup-banner"><div class="title">⚠️ FOLLOW-UP REQUIRED</div>' +
        (pm.followUpNotes ? '<div class="notes">' + pm.followUpNotes + '</div>' : '') + '</div>';
    }

    // Details
    html += '<div class="detail-section"><div class="detail-header">📋 Work Order Details</div><div class="detail-body">';
    html += '<div class="detail-row"><div class="detail-label">Equipment</div><div class="detail-value">' + (pm.equipment || '—') + '</div></div>';
    html += '<div class="detail-row"><div class="detail-label">Service</div><div class="detail-value">' + (pm.frequency || '—') + '</div></div>';
    html += '<div class="detail-row"><div class="detail-label">Facility</div><div class="detail-value">' + (pm.facility || '—') + '</div></div>';
    html += '<div class="detail-row"><div class="detail-label">Technician(s)</div><div class="detail-value">' + (pm.technician || '—') + '</div></div>';
    html += '<div class="detail-row"><div class="detail-label">Date</div><div class="detail-value">' + (pm.dateFormatted || pm.date || '—') + '</div></div>';
    if (pm.tasksCompleted) html += '<div class="detail-row"><div class="detail-label">Tasks</div><div class="detail-value">' + pm.tasksCompleted + '</div></div>';
    html += '<div class="detail-row"><div class="detail-label">Follow-up</div><div class="detail-value" style="color:' + (pm.followUp ? '#DC2626;font-weight:700' : '#16a34a') + '">' + (pm.followUp ? 'YES' : 'No') + '</div></div>';
    html += '</div></div>';

    // General Comments
    if (pm.generalComments) {
      html += '<div class="detail-section"><div class="detail-header">💬 Comments / Findings</div><div class="detail-body">' +
        '<div style="font-size:14px;color:var(--text);line-height:1.5;">' + pm.generalComments.replace(/\n/g, '<br>') + '</div></div></div>';
    }

    // Safety Data
    if (pm.safetyData && pm.safetyData.length) {
      const safetyLabels = ['PPE Condition', 'Pre-Job Safety', 'Electrical Safety', 'Gas & Chemical Safety', 'Post-Job'];
      html += '<div class="detail-section"><div class="detail-header">🛡 Safety Checklist</div><div class="detail-body">';
      pm.safetyData.forEach((section, si) => {
        html += '<div class="safety-section-label">' + (safetyLabels[si] || 'Section ' + (si + 1)) + '</div>';
        section.forEach(row => {
          const icon = row.done ? '✅' : (row.na ? '➖' : '⬜');
          const extra = row.condition ? ' <span style="color:#64748b;">(' + row.condition + ')</span>' : '';
          html += '<div class="safety-row">' + icon + ' ' + row.task + extra + '</div>';
        });
      });
      html += '</div></div>';
    }

    // Checklist Data
    if (pm.checklistData && pm.checklistData.length) {
      html += '<div class="detail-section"><div class="detail-header">🔧 PM Checklist</div><div class="detail-body">';
      pm.checklistData.forEach(cl => {
        html += '<div style="font-size:13px;font-weight:700;color:var(--navy);margin:12px 0 6px;border-bottom:1px solid #e2e8f0;padding-bottom:4px;">' + cl.header + '</div>';
        cl.tasks.forEach(t => {
          html += '<div class="checklist-task">' + (t.done ? '✅' : '⬜') + ' ' + t.text + '</div>';
        });
        if (cl.findings) {
          html += '<div class="findings-box"><b>Findings:</b> ' + cl.findings.replace(/\n/g, '<br>') + '</div>';
        }
      });
      html += '</div></div>';
    }

    // Resend button
    if (pm.emailHtml) {
      html += '<button class="resend-btn" onclick="resendRecord()">📧 Resend This PM Report</button>';
      window._currentPMRecord = pm;
    }

    // Archived info
    html += '<div style="text-align:center;margin-top:16px;font-size:11px;color:var(--text-light);">Archived: ' + (pm.createdAt ? new Date(pm.createdAt).toLocaleString() : '—') + '</div>';

    content.innerHTML = html;
  } catch (e) {
    content.innerHTML = '<div class="empty">Error loading record: ' + e.message + '</div>';
  }
}

async function resendRecord() {
  const pm = window._currentPMRecord;
  if (!pm || !pm.emailHtml) return;

  const subject = (pm.equipment || 'PM') + ' - ' + (pm.frequency === 'Repair' ? 'Repair' : (pm.frequency || '') + ' PM') + ' - ' + (pm.technician || '') + ' - ' + (pm.dateFormatted || '');

  if (!confirm('Resend this PM report?\n\n' + subject)) return;

  const btn = document.querySelector('.resend-btn');
  btn.textContent = 'Sending…';
  btn.disabled = true;

  try {
    const res = await fetch('/api/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        to: ['mateusz.targosz@versantmedia.com', 'sean.fanning@versantmedia.com'],
        subject: '(Resent) ' + subject,
        html: pm.emailHtml
      })
    });
    const result = await res.json();
    if (result.success) {
      alert('✓ PM Report resent successfully!');
    } else {
      alert('Resend failed: ' + (result.error || 'Unknown error'));
    }
  } catch (e) {
    alert('Could not resend: ' + e.message);
  }
  btn.textContent = '📧 Resend This PM Report';
  btn.disabled = false;
}

// Init
navigate([]);
</script>
</body>
</html>
